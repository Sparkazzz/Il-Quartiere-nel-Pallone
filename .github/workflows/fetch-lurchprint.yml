name: Fetch Lurch Print assets

on:
  push:
    branches: [lukas-author-demo]
    paths:
      - '.github/workflows/fetch-lurchprint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lukas-author-demo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Lurch Print public images quickly
        run: |
          python - <<'PY'
          import os,re,concurrent.futures
          from urllib.parse import urljoin,urlparse
          from urllib.request import Request,urlopen
          BASE='https://lurchprint.de/'
          OUT='lukas-author-demo/assets/lurchprint'
          os.makedirs(OUT,exist_ok=True)
          UA='Mozilla/5.0 AppleWebKit/537.36 Chrome/127 Safari/537.36'
          def get(u,b=False,t=6):
              req=Request(u,headers={'User-Agent':UA,'Accept':'*/*'})
              with urlopen(req,timeout=t) as r:
                  d=r.read(); return d if b else d.decode('utf-8','ignore')
          pages=[BASE]
          for p in ['wp-sitemap.xml','sitemap.xml','shop/','produkt/','produkte/','autor/','ueber-mich/','das-kind-mit-der-roten-muetze/','episoden-von-alatar-und-dem-tannhaeuser-tor/']:
              pages.append(urljoin(BASE,p))
          for sm in ['wp-sitemap.xml','sitemap.xml']:
              try: pages += re.findall(r'<loc>\s*(.*?)\s*</loc>',get(urljoin(BASE,sm),t=5),re.I|re.S)
              except Exception: pass
          uniq=[]
          for u in pages:
              u=u.strip().replace('&amp;','&')
              if urlparse(u).netloc.endswith('lurchprint.de') and u not in uniq: uniq.append(u)
          pages=uniq[:50]
          def fp(u):
              try:return u,get(u,t=6),''
              except Exception as e:return u,'',repr(e)
          docs=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=15) as ex:
              docs=list(ex.map(fp,pages))
          imgs=set(); page_rows=[]
          for u,h,e in docs:
              page_rows.append((u,'OK' if h else 'ERR '+e))
              if not h: continue
              candidates=[]
              candidates += re.findall(r'(?:src|data-src|data-lazy-src|content)=[\"\']([^\"\']+)[\"\']',h,re.I)
              candidates += re.findall(r'(?:https?:)?//[^\"\'\s)]+?\.(?:jpe?g|png|webp|gif|avif)(?:\?[^\"\'\s)]*)?',h,re.I)
              candidates += re.findall(r'[^\"\'\s()]+/wp-content/uploads/[^\"\'\s()]+?\.(?:jpe?g|png|webp|gif|avif)(?:\?[^\"\'\s)]*)?',h,re.I)
              for c in candidates:
                  if c.startswith('//'): c='https:'+c
                  x=urljoin(u,c.replace('\\/','/').replace('&amp;','&'))
                  if urlparse(x).netloc.endswith('lurchprint.de') and re.search(r'\.(?:jpe?g|png|webp|gif|avif)(?:\?|$)',x,re.I): imgs.add(x)
          def dl(pair):
              i,u=pair
              try:
                  d=get(u,True,8)
                  if len(d)<2500:return None
                  ext=os.path.splitext(urlparse(u).path)[1].lower()
                  if ext not in ('.jpg','.jpeg','.png','.webp','.gif','.avif'):ext='.bin'
                  base=re.sub(r'[^A-Za-z0-9._-]+','-',os.path.basename(urlparse(u).path) or f'image{ext}')
                  fn=f'{i:03d}-{base}'
                  open(os.path.join(OUT,fn),'wb').write(d)
                  return fn,len(d),u
              except Exception:return None
          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=15) as ex:
              for r in ex.map(dl,enumerate(sorted(imgs))):
                  if r:rows.append(r)
          with open(os.path.join(OUT,'manifest.tsv'),'w',encoding='utf-8') as f:
              f.write('file\tbytes\tsource\n')
              for r in rows:f.write('\t'.join(map(str,r))+'\n')
          with open(os.path.join(OUT,'pages.tsv'),'w',encoding='utf-8') as f:
              for r in page_rows:f.write('\t'.join(r)+'\n')
          print('PAGES',len(pages),'IMAGES',len(rows))
          PY
      - name: Commit downloaded assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lukas-author-demo/assets/lurchprint
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Lurch Print image assets [skip ci]'
          git push origin HEAD:lukas-author-demo
