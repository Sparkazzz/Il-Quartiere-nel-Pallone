name: Shrink Lukas demo HTML

on:
  push:
    branches: [lukas-author-demo]
    paths:
      - '.github/workflows/shrink-lukas-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lukas-author-demo
      - name: Replace embedded images with repo assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('lukas-author-demo/index.html')
          s=p.read_text(encoding='utf-8')
          mapping={
            'Porträt von Lukas R. Pawlak':'assets/lurchprint/063-Lukas.webp',
            'Lukas R. Pawlak':'assets/lurchprint/063-Lukas.webp',
            'Cover von Episoden von Alatar und dem Tannhäuser Tor':'assets/lurchprint/056-Cover-Front.webp',
            'Episoden von Alatar und dem Tannhäuser Tor':'assets/lurchprint/056-Cover-Front.webp',
            'Cover von Das Kind mit der roten Mütze':'assets/lurchprint/067-buchcover.webp',
            'Das Kind mit der roten Mütze':'assets/lurchprint/067-buchcover.webp',
          }
          def repl(m):
              tag=m.group(0)
              altm=re.search(r'alt="([^"]+)"',tag)
              if not altm: return tag
              src=mapping.get(altm.group(1))
              if not src: return tag
              return re.sub(r'src="data:image/[^"]+"',f'src="{src}"',tag)
          s=re.sub(r'<img[^>]+>',repl,s)
          p.write_text(s,encoding='utf-8')
          print('new size',p.stat().st_size)
          PY
      - name: Commit lightweight HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lukas-author-demo/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use lightweight image assets for Lukas demo [skip ci]'
          git push origin HEAD:lukas-author-demo
